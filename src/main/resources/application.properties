spring.application.name=web-scrape
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== News Aggregator ====================
# Размер пула потоков Executor Framework, используемого для параллельного
# опроса источников новостей (см. NewsService).
news.aggregation.pool-size=5
# Общий таймаут на весь запрос агрегации (секунды): если какой-то источник
# не успел ответить за это время, его задача отменяется, а остальные
# результаты всё равно возвращаются пользователю.
news.aggregation.timeout-seconds=10
# Сколько новостей запрашивать у каждого источника по умолчанию, если
# клиент API не передал параметр limit.
news.aggregation.per-source-limit=10

# API-ключи источников новостей. Оставьте пустыми, чтобы отключить источник -
# он будет пропущен при агрегации (со статусом "ключ не настроен" в ответе),
# остальные источники продолжат работать в обычном режиме.
news.source.newsapi.key=
news.source.gnews.key=
news.source.currents.key=
news.source.guardian.key=
news.source.nytimes.key=